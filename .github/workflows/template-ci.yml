name: Template CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile renderer contract
        run: javac -d target/template-test .template/Renderer.java .template/RendererTest.java
      - name: Verify renderer contract
        run: java -cp target/template-test RendererTest

  generated-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: swing
            module: app
          - flavor: libgdx
            module: game
          - flavor: spring-ssr
            module: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate project
        run: java .template/Renderer.java --slug sample-app --name "Sample App" --description "Sample" --owner gstn-caruso --flavor ${{ matrix.flavor }}
      - name: Test project
        run: mvn -B verify
      - name: Build release JAR
        run: mvn -B -Drevision=0.1.999 package
      - name: Package Debian release
        run: jpackage --type deb --input ${{ matrix.module }}/target --main-jar sample-app-${{ matrix.module }}-0.1.999.jar --name sample-app --app-version 0.1.999 --dest ${{ runner.temp }} --linux-package-name sample-app
      - name: Check bundled Java VM
        run: dpkg-deb -c ${{ runner.temp }}/sample-app_0.1.999_amd64.deb | grep '/lib/runtime/lib/server/libjvm.so'
      - name: Check release JAR
        run: jar tf ${{ matrix.module }}/target/sample-app-${{ matrix.module }}-0.1.999.jar
