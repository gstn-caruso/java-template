name: Template CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .template/render-test.sh

  verify:
    strategy:
      fail-fast: false
      matrix:
        flavor: [libgdx, plain]
        release: [tag-only, commit-back]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Render a sample project
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          tar --exclude=.git -cf - . | tar -xf - -C "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          bash .template/render.sh --slug sample-game --name "Sample Game" \
            --description "A sample game." --owner gstn-caruso \
            --flavor ${{ matrix.flavor }} --release ${{ matrix.release }} \
            --author "CI" --email ci@example.com

      - name: Resolve the app module for the flavor
        run: |
          case ${{ matrix.flavor }} in
            libgdx) module=game ;;
            plain) module=app ;;
          esac
          echo "MODULE=$module" >> "$GITHUB_ENV"

      - name: Build and test the rendered project
        working-directory: ${{ runner.temp }}/out
        run: mvn -B verify

      - name: Inspect the rendered .deb
        working-directory: ${{ runner.temp }}/out
        run: |
          deb=$(ls "$MODULE"/target/sample-game_*_all.deb)
          dpkg-deb -I "$deb" | grep 'Package: sample-game' >/dev/null
          dpkg-deb -c "$deb" | grep '\./usr/bin/sample-game$' >/dev/null
          dpkg-deb -c "$deb" | grep "\\./usr/share/sample-game/sample-game-${MODULE}\\.jar\$" >/dev/null
          if [[ ${{ matrix.flavor }} == libgdx ]]; then
            dpkg-deb -c "$deb" | grep '\./usr/share/applications/sample-game\.desktop$' >/dev/null
          else
            if dpkg-deb -c "$deb" | grep '\.desktop$' >/dev/null; then
              echo "the plain .deb should not contain a .desktop entry"
              exit 1
            fi
          fi

      - name: Run the plain jar
        if: matrix.flavor == 'plain'
        working-directory: ${{ runner.temp }}/out
        run: |
          jar=$(ls app/target/sample-game-app-*.jar)
          java -jar "$jar" | grep -q 'Sample Game'

      - name: Build a release .deb with prepare-release.sh
        working-directory: ${{ runner.temp }}/out
        run: |
          bash scripts/prepare-release.sh 9.9.9
          test -f "$MODULE"/target/sample-game_9.9.9_all.deb

      - name: A failing test fails the build
        working-directory: ${{ runner.temp }}/out
        run: |
          mkdir -p domain/src/test/java/samplegame/domain
          cat > domain/src/test/java/samplegame/domain/HarnessTest.java <<'JAVA'
          package samplegame.domain;

          import org.junit.jupiter.api.Test;

          import static org.assertj.core.api.Assertions.assertThat;

          class HarnessTest {

              @Test
              void fails() {
                  assertThat(1).isEqualTo(2);
              }
          }
          JAVA
          if mvn -q -B test; then
            echo "a failing test did not fail the build"
            exit 1
          fi

  build:
    needs: [render-test, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require render-test and verify to succeed
        run: |
          if [[ "${{ needs.render-test.result }}" != "success" || "${{ needs.verify.result }}" != "success" ]]; then
            echo "render-test=${{ needs.render-test.result }} verify=${{ needs.verify.result }}"
            exit 1
          fi
